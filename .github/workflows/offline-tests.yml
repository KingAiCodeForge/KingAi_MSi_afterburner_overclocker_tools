name: Offline safety tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lint tool
        run: python -m pip install ruff==0.12.4
      - name: Lint
        run: python -m ruff check scripts tests
      - name: Compile
        run: python -m compileall -q scripts tests
      - name: Run offline regression suite
        run: python -m unittest discover -s tests -v

  windows-powershell-51:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Verify Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $failed = $false
          foreach ($path in @(
            "scripts/apply_profiles.ps1",
            "scripts/decode_vf_curve.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_ }
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
      - name: Run offline regression suite
        run: python -m unittest discover -s tests -v
